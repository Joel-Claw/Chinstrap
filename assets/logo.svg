<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Chinstrap penguin logo for the Chinstrap browser -->
  <!-- CC0 Public Domain -->
  <circle cx="256" cy="256" r="250" fill="#0033AA"/>
  
  <!-- Penguin body -->
  <ellipse cx="256" cy="300" rx="120" ry="160" fill="#1a1a1a"/>
  
  <!-- White belly -->
  <ellipse cx="256" cy="310" rx="85" ry="130" fill="#f5f5f5"/>
  
  <!-- Head -->
  <circle cx="256" cy="160" r="80" fill="#1a1a1a"/>
  
  <!-- White face -->
  <ellipse cx="256" cy="175" rx="55" ry="60" fill="#f5f5f5"/>
  
  <!-- Chinstrap line (the defining feature of chinstrap penguins) -->
  <path d="M 196 170 Q 256 200 316 170" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="230" cy="150" r="8" fill="#1a1a1a"/>
  <circle cx="282" cy="150" r="8" fill="#1a1a1a"/>
  <circle cx="232" cy="148" r="3" fill="#ffffff"/>
  <circle cx="284" cy="148" r="3" fill="#ffffff"/>
  
  <!-- Beak -->
  <path d="M 246 175 L 266 175 L 256 192 Z" fill="#f5a623"/>
  
  <!-- Wings/flippers -->
  <ellipse cx="145" cy="290" rx="35" ry="95" fill="#1a1a1a" transform="rotate(-15 145 290)"/>
  <ellipse cx="367" cy="290" rx="35" ry="95" fill="#1a1a1a" transform="rotate(15 367 290)"/>
  
  <!-- Feet -->
  <ellipse cx="215" cy="455" rx="40" ry="18" fill="#f5a623"/>
  <ellipse cx="297" cy="455" rx="40" ry="18" fill="#f5a623"/>
  
  <!-- Browser badge: small window icon in corner -->
  <rect x="370" y="50" width="110" height="85" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="370" y="50" width="110" height="20" rx="8" fill="#0033AA"/>
  <circle cx="385" cy="60" r="4" fill="#ff5f56"/>
  <circle cx="400" cy="60" r="4" fill="#ffbd2e"/>
  <circle cx="415" cy="60" r="4" fill="#27c93f"/>
  <rect x="380" y="80" width="90" height="3" fill="#0033AA" rx="1"/>
  <rect x="380" y="90" width="60" height="3" fill="#0033AA" rx="1"/>
  <rect x="380" y="100" width="75" height="3" fill="#0033AA" rx="1"/>
  <rect x="380" y="110" width="45" height="3" fill="#0033AA" rx="1"/>
  <rect x="380" y="120" width="70" height="3" fill="#0033AA" rx="1"/>
</svg>