# =========================================================================
# Release CI Workflow
# =========================================================================
# TEACHING NOTE: This workflow runs when a version tag (v*) is pushed.
# It builds x86_64 binaries on both Debian (Ubuntu) and Arch Linux,
# creates proper packages (.deb and .pkg.tar.zst), and attaches them
# to a GitHub Release.
#
# The flow is:
#   1. Tag pushed (e.g., "git tag v0.2.0 && git push --tags")
#   2. This workflow triggers
#   3. Build jobs run in parallel: Ubuntu (x86_64 .deb) and Arch (x86_64 .pkg.tar.zst)
#   4. A standalone x86_64 binary is also produced
#   5. All artifacts are uploaded to the GitHub Release
#
# The .deb is built manually (dpkg-deb) for full control over contents.
# The .pkg.tar.zst is built manually (tar + zstd) for Arch compatibility.
# Both include the binary, fonts, desktop file, and icon.
# =========================================================================

name: Release

on:
  push:
    tags:
      - "v*"

# -------------------------------------------------------------------------
# Permissions: We need write access to create releases and upload assets.
# -------------------------------------------------------------------------
permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Build x86_64 .deb package on Ubuntu
  # -------------------------------------------------------------------------
  build-deb-x86_64:
    name: Build .deb (x86_64, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make

      - name: Configure and Build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)" chinstrap
          strip chinstrap

      - name: Create .deb package
        run: |
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/chinstrap/fonts \
            pkg/usr/share/applications pkg/usr/share/icons/hicolor/scalable/apps
          cp build/chinstrap pkg/usr/bin/
          cp assets/fonts/*.ttf pkg/usr/share/chinstrap/fonts/ 2>/dev/null || true
          cp cmake/debian/chinstrap.desktop pkg/usr/share/applications/
          cp assets/icon.svg pkg/usr/share/icons/hicolor/scalable/apps/chinstrap.svg
          cat > pkg/DEBIAN/control << 'CTRL'
          Package: chinstrap
          Version: ${{ github.ref_name }}
          Section: web
          Priority: optional
          Architecture: amd64
          Depends: libstdc++6, libc6, libgcc-s1
          Maintainer: Chinstrap Project <https://github.com/Joel-Claw/Chinstrap>
          Description: Educational from-scratch web browser (zero third-party libraries)
           Chinstrap is a web browser written entirely in C++17 with no external
           dependencies. It implements its own HTML parser, CSS engine, JavaScript
           interpreter, TLS stack, HTTP client, and rendering pipeline from scratch.
           .
           Features:
            * HTML5 parsing
            * CSS3 parsing and layout
            * JavaScript ES6 interpreter
            * TLS 1.2/1.3 encryption
            * HTTP/1.1 and HTTP/2 support
            * X11/Wayland/framebuffer backends
            * Plugin system (shared libraries)
            * CC0 licensed fonts bundled
          Homepage: https://github.com/Joel-Claw/Chinstrap
          License: CC0-1.0
          CTRL
          dpkg-deb --build --root-owner-group pkg chinstrap_${{ github.ref_name }}_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-x86_64
          path: chinstrap_*.deb

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64
          path: build/chinstrap

  # -------------------------------------------------------------------------
  # Build x86_64 .pkg.tar.zst package on Arch
  # -------------------------------------------------------------------------
  build-arch-x86_64:
    name: Build .pkg.tar.zst (x86_64, Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm cmake gcc make zstd tar

      - name: Configure and Build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)" chinstrap
          strip chinstrap

      - name: Create .pkg.tar.zst package
        run: |
          mkdir -p pkg/usr/bin pkg/usr/share/chinstrap/fonts \
            pkg/usr/share/applications pkg/usr/share/icons/hicolor/scalable/apps
          cp build/chinstrap pkg/usr/bin/
          cp assets/fonts/*.ttf pkg/usr/share/chinstrap/fonts/ 2>/dev/null || true
          cp cmake/debian/chinstrap.desktop pkg/usr/share/applications/
          cp assets/icon.svg pkg/usr/share/icons/hicolor/scalable/apps/chinstrap.svg
          cat > pkg/.PKGINFO << 'PKGINFO'
          pkgname = chinstrap
          pkgver = ${{ github.ref_name }}-1
          pkgdesc = Educational from-scratch web browser (zero third-party libraries)
          url = https://github.com/Joel-Claw/Chinstrap
          builddate = $(date +%s)
          packager = Chinstrap Project
          arch = x86_64
          license = CC0-1.0
          depend = libstdc++6
          depend = glibc
          PKGINFO
          cd pkg
          tar -cf - .PKGINFO usr/ | zstd -19 -o ../chinstrap_${{ github.ref_name }}_x86_64.pkg.tar.zst

      - name: Upload .pkg.tar.zst artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: chinstrap_*.pkg.tar.zst

  # -------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # -------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-deb-x86_64, build-arch-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: deb-x86_64
          path: release-assets/

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-x86_64
          path: release-assets/

      - name: Download standalone binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64
          path: release-assets/

      - name: Rename standalone binary
        run: |
          cd release-assets
          mv chinstrap chinstrap_${{ github.ref_name }}_x86_64
          chmod +x chinstrap_${{ github.ref_name }}_x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          tag_name: ${{ github.ref_name }}
          name: Chinstrap ${{ github.ref_name }}
          body: |
            ## Chinstrap ${{ github.ref_name }}

            A from-scratch web browser with zero third-party libraries. CC0 licensed.

            ### Downloads (x86_64)

            - **chinstrap_*_amd64.deb** - Debian/Ubuntu package (x86_64)
            - **chinstrap_*_x86_64.pkg.tar.zst** - Arch Linux package (x86_64)
            - **chinstrap_*_x86_64** - Standalone binary (no install needed)

            ### Install

            Debian/Ubuntu:
            ```
            sudo dpkg -i chinstrap_*_amd64.deb
            chinstrap http://example.com
            ```

            Arch Linux:
            ```
            sudo pacman -U chinstrap_*_x86_64.pkg.tar.zst
            chinstrap http://example.com
            ```

            Standalone binary:
            ```
            chmod +x chinstrap_*_x86_64
            ./chinstrap_*_x86_64 http://example.com
            ```

            ### Build from source

            ```
            git clone https://github.com/Joel-Claw/Chinstrap.git
            cd Chinstrap
            mkdir build && cd build
            cmake ..
            make -j2
            ctest --output-on-failure
            ./chinstrap http://example.com
            ```

            ### License

            CC0 1.0 Universal (Public Domain Dedication)
          files: |
            release-assets/*.deb
            release-assets/*.pkg.tar.zst
            release-assets/chinstrap_*_x86_64